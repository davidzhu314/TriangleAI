name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if package.json is missing
        id: has_pkg
        run: test -f package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      # pnpm version comes from packageManager in package.json (9.15.9).
      - uses: pnpm/action-setup@v4
        if: steps.has_pkg.outputs.yes == 'true'
      - uses: actions/setup-node@v4
        if: steps.has_pkg.outputs.yes == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.has_pkg.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has_pkg.outputs.yes == 'true'
        run: pnpm test
      - if: steps.has_pkg.outputs.yes == 'true'
        run: pnpm build

  physics-bridge:
    runs-on: ubuntu-latest
    # Python 3.9 matches CathSim (spec §5.2); hosted runners no longer ship it, so use the official image.
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Skip if physics tests are missing
        id: has_py
        run: test -f physics/requirements-test.txt && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      # Bridge tests only: messages and fallback, with CathSim mocked. CathSim itself never runs in CI.
      - if: steps.has_py.outputs.yes == 'true'
        run: pip install -r physics/requirements-test.txt && pytest physics -p no:cacheprovider
